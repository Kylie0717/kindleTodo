<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindle Todo - 待办事项</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <h1>Kindle Todo</h1>
            <p class="date-display" id="current-date"></p>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">☀</button>
        </header>
        
        <main>
            <form id="task-form">
                <input type="text" id="task-input" placeholder="添加新任务..." aria-label="Add new task">
                <button type="submit" id="add-task-btn">添加</button>
            </form>
            
            <div class="task-list-container">
                <div class="task-header">
                    <h2>今日任务</h2>
                    <div class="task-actions">
                        <button id="clear-pending-btn" class="action-btn">清除昨日任务</button>
                    </div>
                </div>
                <ul id="task-list"></ul>
            </div>
        </main>
        
        <footer>
            <p>点击任务即可标记为完成 • <span id="storage-status"></span> • <a href="about.html" class="nav-link">关于</a> • <a href="#" id="export-btn" class="nav-link">导出 TXT</a></p>
        </footer>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
